<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#623d27"><title>咱兜的留言簿</title><link rel="stylesheet" href="styles.css"></head>
<body><a class="skip" href="#message">跳到寫留言</a><header><div class="brand"><b>家</b><div><small>平安・順心</small><h1>咱兜的留言簿</h1></div></div><nav aria-label="顯示設定"><button id="smaller">字 −</button><button id="larger">字 ＋</button><button id="contrast" aria-pressed="false">◐ 高對比</button></nav></header>
<main><section class="welcome"><strong>爸爸、媽媽您好</strong><h2>有什麼事情，記在這裡就好</h2><p>按紅色麥克風說話，說完後再按一次。</p></section>
<section class="panel"><div class="title"><i>壹</i><div><small>新增一筆</small><h2>寫留言</h2></div></div><label for="message">留言內容</label><textarea id="message" rows="5" maxlength="500" placeholder="可以打字，也可以按下方的麥克風說話…"></textarea><p id="status" aria-live="polite">準備好了，請按麥克風開始說話</p><div class="actions"><button id="mic" class="mic" aria-pressed="false">🎙️ <span>按一下，開始說話</span></button><button id="save" class="save">✓ 儲存留言</button></div><p class="privacy">🔒 留言只儲存在這台裝置裡</p></section>
<section class="panel"><div class="title"><i>貳</i><div><small>慢慢看</small><h2>之前的留言</h2></div></div><div id="empty" class="empty"><b>福</b><p>目前還沒有留言</p><small>第一筆留言會出現在這裡</small></div><ul id="list" aria-live="polite"></ul></section></main><div id="toast" role="status"></div><footer>一家平安・日日是好日</footer><script src="app.js"></script></body></html>
